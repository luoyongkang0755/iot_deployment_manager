# IoT deployment parameters
# 阶段2：候选基座位姿生成；后续阶段参数先定义
arm_reach_min: 0.20        # Piper 近距离几何死区
arm_reach_max: 0.60        # Piper 工作半径 626.75mm，留余量
candidate_radius_count: 3  # 候选圈数
candidate_angle_step: 30.0 # 每圈角度步长(度)
base_link_z: 0.054        # 机械臂安装高度
gripper_z_offset: 0.267      # 占位！填入阶段1实测值
                           # （tf2_echo base_link link6 的 z）

# 以下参数后续阶段使用，先定义
shelf_height: 0.5
height_tolerance: 0.1
score_distance_weight: 0.6
score_heading_weight: 0.4
ideal_reach_ratio: 0.7
reach_sigma: 0.1
robot_radius: 0.25
map_required: false
