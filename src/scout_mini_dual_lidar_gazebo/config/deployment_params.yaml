# IoT deployment parameters
deployment_approach_node:
  ros__parameters:
    # 候选生成
    arm_reach_min: 0.25        # 最小接近距离（支柱在后缘，无障碍）
    arm_reach_max: 0.50        # 最大放置半径
    candidate_radius_count: 2  # 候选圈数
    candidate_angle_step: 30.0 # 每圈角度步长(度)
    # 可达性过滤
    base_link_z: 0.054         # 机械臂安装高度
    gripper_z_offset: 0.267    # 机械臂抓取高度偏移
    height_tolerance: 0.25     # 目标高度容差(m)，覆盖 z=0.5 货架场景
    # 评分
    score_distance_weight: 0.6
    score_heading_weight: 0.4
    ideal_reach_ratio: 0.7
    reach_sigma: 0.1
    # 占据过滤
    robot_radius: 0.25
    map_required: false
    # 预留
    shelf_height: 0.5
    # 接近即停：导航中止时，机器人距目标 <= 此距离则视为到达（碰到桌子等）
    proximity_threshold: 1.0
